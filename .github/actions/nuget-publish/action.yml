name: NuGet publish (Trusted Publishing)
description: >
  Downloads the "nupkg" artifact produced by nuget-pack.yml, exchanges the GitHub OIDC token
  for a short-lived nuget.org API key (NuGet/login), pushes the packages and creates a GitHub
  Release on the tag with the .nupkg files attached.
  The calling job needs `permissions: id-token: write` and `contents: write` (read if
  github-release is false) and should run in environment `nuget.org`.

inputs:
  user:
    description: nuget.org profile name that owns the packages (not an e-mail address)
    required: false
    default: roblohman
  artifact-name:
    description: Name of the artifact that holds the .nupkg files
    required: false
    default: nupkg
  github-release:
    description: Create a GitHub Release for the tag (auto-generated notes, nupkg attached)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: nupkg

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: NuGet login (OIDC -> temporary API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.user }}

    - name: Push to nuget.org
      shell: bash
      run: >
        dotnet nuget push "nupkg/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --skip-duplicate

    # After the push on purpose: a failure here must never block the NuGet release.
    - name: GitHub Release
      if: inputs.github-release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: nupkg/*.nupkg
