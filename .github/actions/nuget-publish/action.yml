name: NuGet publish (Trusted Publishing)
description: >
  Downloads the "nupkg" artifact produced by nuget-pack.yml, exchanges the GitHub OIDC token
  for a short-lived nuget.org API key (NuGet/login) and pushes the packages.
  The calling job needs `permissions: id-token: write` and should run in environment `nuget.org`.

inputs:
  user:
    description: nuget.org profile name that owns the packages (not an e-mail address)
    required: false
    default: roblohman
  artifact-name:
    description: Name of the artifact that holds the .nupkg files
    required: false
    default: nupkg

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: nupkg

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: NuGet login (OIDC -> temporary API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.user }}

    - name: Push to nuget.org
      shell: bash
      run: >
        dotnet nuget push "nupkg/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --skip-duplicate
